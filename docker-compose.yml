version: "3.8"

# ============================================
#  云端模式（默认）：无 SD / 无 Ollama，图片自动降级到免费图源
#  启动：docker compose up -d
# ============================================
services:
  autowechat:
    build: .
    ports:
      - "5000:5000"
    environment:
      - CLOUD_MODE=1
      - SD_ENABLED=False
      - WEBUI_TOKEN=${WEBUI_TOKEN:-}
    env_file:
      - .env
    volumes:
      # 持久化历史记录和技能树状态
      - ./hotspots_history.json:/app/hotspots_history.json
      - ./github_history.json:/app/github_history.json
      - ./github_publish_records.json:/app/github_publish_records.json
      - ./aikepu_history.json:/app/aikepu_history.json
      - ./aikepu_skill_tree.json:/app/aikepu_skill_tree.json
    restart: unless-stopped
