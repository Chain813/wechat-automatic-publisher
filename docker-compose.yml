version: "3.8"

# ============================================
#  云端模式（默认）：无本地 SD，配图由 Qwen-Image-3.0 与 Pillow 矢量卡片兜底
#  启动：docker compose up -d
# ============================================
services:
  autowechat:
    build: .
    ports:
      - "5000:5000"
    environment:
      - CLOUD_MODE=1
      - SD_ENABLED=False
      - WEBUI_TOKEN=${WEBUI_TOKEN:-}
    env_file:
      - .env
    volumes:
      # 持久化 SQLite 数据库、知识体系与生成的图片资产
      - ./data:/app/data
      - ./assets:/app/assets
    restart: unless-stopped
