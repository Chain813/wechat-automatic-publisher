<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoWeChat Cloud — 控制台登入</title>
    <link rel="stylesheet" href="/static/css/tokens.css?v=2026">
    <link rel="stylesheet" href="/static/css/components.css?v=2026">
    <link rel="stylesheet" href="/static/css/views.css?v=2026">
</head>
<body>
    <div class="ambient-canvas" aria-hidden="true">
        <div class="ambient-blob ambient-blob-1"></div>
        <div class="ambient-blob ambient-blob-2"></div>
        <div class="ambient-blob ambient-blob-3"></div>
        <div class="ambient-grid"></div>
        <div class="ambient-noise"></div>
    </div>

    <div class="login-shell">
        <div class="login-card">
            <div class="login-logo">
                <div class="brand-mark" style="font-size: 20px; gap: 10px;">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                        <polyline points="2 17 12 22 22 17"></polyline>
                        <polyline points="2 12 12 17 22 12"></polyline>
                    </svg>
                    <span>AutoWeChat</span>
                    <span class="brand-badge">Cloud</span>
                </div>
                <div class="login-subtitle">Linear Modern Light 控制台认证</div>
            </div>

            <form id="login-form">
                <div style="display: flex; flex-direction: column; gap: 8px;">
                    <label for="token" style="font-size: 12px; font-weight: 600; color: var(--text-secondary);">访问 Token</label>
                    <input type="password" id="token" name="password" class="linear-input" placeholder="输入访问密钥 Token" autofocus autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 20px;">
                    登入工作台
                </button>
                <div class="error" id="error" style="color: var(--status-danger); font-size: 12px; margin-top: 10px; text-align: center; display: none;"></div>
            </form>
        </div>
    </div>

    <script type="module" src="/static/js/main.js?v=2026"></script>
</body>
</html>
