<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoWeChat Cloud</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 45%, #f5f3ff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        #threejs-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; }
        .login-box {
            position: relative; z-index: 1;
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(20px);
            border: 1px solid #e5e7eb;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(15,23,42,0.08);
            padding: 48px;
            width: 380px;
            text-align: center;
        }
        .login-box h1 {
            font-size: 28px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        .login-box p { color: #94a3b8; font-size: 14px; margin-bottom: 32px; }
        .login-box input {
            width: 100%;
            padding: 14px 18px;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            background: #f8fafc;
            color: #0f172a;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .login-box input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
        }
        .login-box button {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 2px 12px rgba(99,102,241,0.25);
            transition: opacity 0.2s, transform 0.2s;
        }
        .login-box button:hover { opacity: 0.92; transform: translateY(-1px); }
        .error { color: #ef4444; font-size: 13px; margin-top: 12px; display: none; }
    </style>
</head>
<body>
    <canvas id="threejs-bg"></canvas>
    <div class="login-box">
        <h1>🚀 AutoWeChat</h1>
        <p>云端控制台 · 输入 Token 进入</p>
        <form onsubmit="login(event)">
            <input type="password" id="token" placeholder="输入访问 Token" autofocus>
            <button type="submit">进入控制台</button>
            <div class="error" id="error">Token 不正确</div>
        </form>
    </div>
    <script>
        function login(e) {
            e.preventDefault();
            const token = document.getElementById('token').value;
            document.cookie = `aw_token=${token}; path=/; max-age=86400`;
            fetch('/api/status').then(r => {
                if (r.ok) {
                    window.location.href = '/';
                } else {
                    document.getElementById('error').style.display = 'block';
                }
            });
        }
    </script>
    <script src="/static/js/three-bg.js"></script>
</body>
</html>
