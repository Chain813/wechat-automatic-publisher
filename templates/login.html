<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoWeChat Cloud</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-box {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 48px;
            width: 380px;
            text-align: center;
        }
        .login-box h1 {
            font-size: 28px;
            color: #fff;
            margin-bottom: 8px;
        }
        .login-box p {
            color: rgba(255,255,255,0.5);
            font-size: 14px;
            margin-bottom: 32px;
        }
        .login-box input {
            width: 100%;
            padding: 14px 18px;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            background: rgba(255,255,255,0.07);
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        .login-box input:focus {
            border-color: #6c5ce7;
        }
        .login-box button {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #6c5ce7, #a855f7);
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .login-box button:hover { opacity: 0.9; }
        .error { color: #ff6b6b; font-size: 13px; margin-top: 12px; display: none; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>🚀 AutoWeChat</h1>
        <p>云端控制台 · 输入 Token 进入</p>
        <form onsubmit="login(event)">
            <input type="password" id="token" placeholder="输入访问 Token" autofocus>
            <button type="submit">进入控制台</button>
            <div class="error" id="error">Token 不正确</div>
        </form>
    </div>
    <script>
        function login(e) {
            e.preventDefault();
            const token = document.getElementById('token').value;
            document.cookie = `aw_token=${token}; path=/; max-age=86400`;
            fetch('/api/status').then(r => {
                if (r.ok) {
                    window.location.href = '/';
                } else {
                    document.getElementById('error').style.display = 'block';
                }
            });
        }
    </script>
</body>
</html>
